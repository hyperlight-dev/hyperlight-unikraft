# Known test failures — CPython 3.12 on Hyperlight-Unikraft
#
# This file documents every CPython Lib/test/ module that does NOT pass
# in the Unikraft unikernel environment.  The conformance runner reads
# it to build the skip list; any test_*.py module NOT listed here is
# expected to pass.
#
# Categories
# ──────────
#   unsupported — fundamentally impossible in a unikernel
#   may-fix     — could work with future Unikraft improvements
#   fixable     — likely fixable with minor guest-side changes
#
# Run:  just conformance python

# ═══════════════════════════════════════════════════════════════
# Unsupported — will not work in a unikernel
# ═══════════════════════════════════════════════════════════════

# ── Subprocess: tests that still crash ─────────────────────────────
#
# These modules crash because they use os.fork() directly, os.popen(),
# or subprocess in ways that hit missing kernel features (CLONE_VM
# not set, nested vfork, environment variable propagation, etc.).
#
# Note: 16 modules previously in this category now PASS after adding
# sitecustomize.py (sys.executable fix) and leveraging Python 3.12's
# posix_spawn/vfork path for subprocess.run().  The ones that still
# crash genuinely need os.fork() or kernel features Unikraft lacks.
[may-fix.no-subprocess]
reason = "Test uses os.fork(), os.popen(), or subprocess patterns that crash in the vfork-only kernel"
todo = "Investigate per-module: some may just need env-var propagation or signal fixes, not os.fork()"
modules = [
    "test_audit",               # CRASH — sys.audit subprocess isolation
    "test_c_locale_coercion",   # CRASH — locale coercion via env vars across exec
    "test_calendar",            # CRASH — calendar CLI subprocess
    "test_cmd_line",            # CRASH — Python CLI flags (-c, -m) via subprocess
    "test_cmd_line_script",     # CRASH — script execution modes via subprocess
    "test_compile",             # CRASH — compilation edge cases via subprocess
    "test_compileall",          # CRASH — compileall spawns worker subprocesses
    "test_dtrace",              # CRASH — DTrace probes via subprocess
    "test_exceptions",          # CRASH — exception traceback via subprocess
    "test_fork1",               # CRASH — tests os.fork() directly (unsupported)
    "test_gc",                  # CRASH — GC leak detection via subprocess
    "test_hash",                # CRASH — PYTHONHASHSEED via subprocess
    "test_http_cookies",        # CRASH — edge-case tests spawn subprocess
    "test_io",                  # CRASH — I/O crash isolation via subprocess
    "test_mailcap",             # CRASH — MIME handling via subprocess
    "test_os",                  # CRASH — tests os.exec*, spawn, fork
    "test_pdb",                 # CRASH — debugger via subprocess interaction
    "test_perf_profiler",       # CRASH — perf integration via subprocess
    "test_platform",            # CRASH — uname/subprocess for system info
    "test_popen",               # CRASH — tests os.popen() directly
    "test_posix",               # CRASH — tests fork, exec, wait
    "test_regrtest",            # CRASH — runs the test runner itself via subprocess
    "test_repl",                # CRASH — REPL via subprocess stdin/stdout
    "test_shutil",              # CRASH — shutil.which, archive ops via subprocess
    "test_source_encoding",     # CRASH — encoding detection via subprocess
    "test_subprocess",          # CRASH — directly tests subprocess module
    "test_support",             # CRASH — test.support utilities use subprocess
    "test_sys",                 # CRASH — sys.exit, sys.path via subprocess
    "test_trace",               # CRASH — trace module via subprocess
    "test_traceback",           # CRASH — traceback via subprocess
    "test_tracemalloc",         # CRASH — memory tracking via subprocess
    "test_utf8_mode",           # CRASH — PYTHONUTF8 env var via subprocess
    "test_uuid",                # CRASH — system commands via subprocess
    "test_wait3",               # CRASH — tests os.wait3() (needs fork)
    "test_wait4",               # CRASH — tests os.wait4() (needs fork)
]

