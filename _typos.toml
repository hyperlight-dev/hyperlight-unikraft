# The supply-chain demo (demos/supply-chain/) intentionally ships a typosquatted
# package named `reqeusts` (a misspelling of `requests`) — that misspelling is
# the whole point of the demo, so tell typos it is expected.
[default.extend-words]
reqeusts = "reqeusts"
# Arm's Scalable Matrix Extension.
SME = "SME"
# Azure Kubernetes Service, the az command group.
aks = "aks"

# Terminal recordings store typed commands a few characters per event, and
# demo-magic is vendored as published.
[files]
extend-exclude = ["site/casts/*.cast", "site/record/demo-magic.sh"]
