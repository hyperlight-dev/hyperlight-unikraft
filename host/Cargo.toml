[package]
name = "hyperlight-unikraft-host"
version = "0.11.0"
edition = "2021"
description = "Embedded Hyperlight host for running Unikraft unikernels"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hyperlight-dev/hyperlight-unikraft"
homepage = "https://github.com/hyperlight-dev/hyperlight-unikraft"
keywords = ["hyperlight", "unikraft", "unikernel", "microvm", "sandbox"]
categories = ["virtualization"]
readme = "../README.md"

[lib]
name = "hyperlight_unikraft"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "hyperlight-unikraft"
path = "src/main.rs"

[[bin]]
name = "multifn-test"
path = "src/bin/multifn_test.rs"

[[bin]]
name = "pydriver-run"
path = "src/bin/pydriver_run.rs"

[[bin]]
name = "pyhl"
path = "src/bin/pyhl.rs"

[features]
default = []
wasm-host-fns = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
hyperlight-host = { version = "0.16.0", features = ["executable_heap", "hw-interrupts"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
serde_json = "1"
base64 = "0.22"
socket2 = { version = "0.5", features = ["all"] }
ureq = "3"
flate2 = "1"
tar = "0.4"
wasmtime = { version = "36.0.2", optional = true, default-features = false, features = ["cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "36.0.2", optional = true, default-features = false, features = ["preview1"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
tempfile = "3"
