specification: '0.6'
name: vscode-server-hyperlight

unikraft:
  source: https://github.com/danbugs/unikraft.git
  version: feat/vscode-server-fixes
  kconfig:
    CONFIG_PLAT_HYPERLIGHT: 'y'
    CONFIG_PAGING: 'n'
    CONFIG_LIBUKVMEM: 'n'
    CONFIG_LIBUKINTCTLR_HYPERLIGHT: 'y'
    CONFIG_HYPERLIGHT_MAX_GUEST_LOG_LEVEL: 4

    CONFIG_LIBUKPRINT_KLVL_CRIT: 'y'
    CONFIG_LIBUKPRINT_PRINT_TIME: 'n'
    CONFIG_LIBUKPRINT_PRINT_SRCNAME: 'n'
    CONFIG_LIBUKBOOT_BANNER_NONE: 'y'
    CONFIG_OPTIMIZE_SIZE: 'y'
    CONFIG_OPTIMIZE_PIE: 'y'

    # VFS: mount initrd as read-only cpiovfs at /
    CONFIG_LIBVFSCORE: 'y'
    CONFIG_LIBVFSCORE_AUTOMOUNT_CI: 'y'
    CONFIG_LIBVFSCORE_AUTOMOUNT_CI_CUSTOM: 'y'
    CONFIG_LIBVFSCORE_AUTOMOUNT_CI0_MP: '/'
    CONFIG_LIBVFSCORE_AUTOMOUNT_CI0_DRIVER: 'cpiovfs'
    CONFIG_LIBVFSCORE_AUTOMOUNT_CI0_UKOPTS_IFINITRD0: 'y'
    CONFIG_LIBCPIOVFS: 'y'
    CONFIG_LIBUKCPIO: 'y'

    # devfs + hcall (required for hostfs and host-proxied networking)
    CONFIG_LIBDEVFS: 'y'
    CONFIG_LIBDEVFS_AUTOMOUNT: 'y'
    CONFIG_HYPERLIGHT_HCALL: 'y'

    # Host filesystem (writable data dir via --mount)
    CONFIG_LIBHOSTFS: 'y'
    CONFIG_LIBHOSTFS_AUTOMOUNT: 'y'

    # Networking: host-proxied sockets + AF_UNIX (IPC)
    CONFIG_LIBPOSIX_SOCKET: 'y'
    CONFIG_LIBHOSTSOCK: 'y'
    CONFIG_LIBPOSIX_UNIXSOCKET: 'y'

    # FD infrastructure
    CONFIG_LIBPOSIX_FDIO: 'y'
    CONFIG_LIBPOSIX_FDTAB: 'y'
    CONFIG_LIBUKFILE: 'y'

    # ELF loader: run vscode-server's bundled Node.js
    CONFIG_APPELFLOADER: 'y'
    CONFIG_APPELFLOADER_VFSEXEC: 'y'
    CONFIG_APPELFLOADER_CUSTOMAPPNAME: 'n'
    CONFIG_APPELFLOADER_VFSEXEC_ENVPATH: 'n'
    CONFIG_APPELFLOADER_VFSEXEC_PATH: '/opt/vscode-server/node'
    CONFIG_LIBPOSIX_ENVIRON_ENVP0: 'PATH=/opt/vscode-server/bin:/usr/bin:/bin'
    CONFIG_LIBPOSIX_ENVIRON_ENVP1: 'LD_LIBRARY_PATH=/lib/x86_64-linux-gnu:/lib64'
    CONFIG_LIBPOSIX_ENVIRON_ENVP2: 'HOME=/data'
    CONFIG_LIBPOSIX_ENVIRON_ENVP3: 'VSCODE_AGENT_FOLDER=/data'
    CONFIG_LIBELF: 'y'

    # mmap (V8 heap allocator)
    CONFIG_LIBUKMMAP: 'y'

    # futex
    CONFIG_LIBPOSIX_FUTEX: 'y'

    # Random number support
    CONFIG_LIBUKRANDOM_CMDLINE_SEED: 'y'
    CONFIG_LIBUKRANDOM_GETRANDOM: 'y'

    # Threading (required for V8 and libuv)
    CONFIG_LIBPOSIX_PROCESS_MULTITHREADING: 'y'
    CONFIG_LIBUKSCHED: 'y'
    CONFIG_LIBUKSCHEDCOOP: 'y'
    CONFIG_LIBUKMPI: 'y'
    CONFIG_LIBUKLOCK: 'y'
    CONFIG_LIBUKLOCK_SEMAPHORE: 'y'
    CONFIG_LIBUKLOCK_MUTEX: 'y'
    CONFIG_LIBUKBOOT_MAINTHREAD: 'y'
    CONFIG_LIBPOSIX_PROCESS_ARCH_PRCTL: 'y'

    # poll + eventfd (required for libuv event loop)
    CONFIG_LIBPOSIX_POLL: 'y'
    CONFIG_LIBPOSIX_EVENTFD: 'y'

    # Multiprocess support (vfork + execve for extension host spawning)
    CONFIG_LIBPOSIX_PROCESS_MULTIPROCESS: 'y'
    CONFIG_LIBPOSIX_PROCESS_EXECVE: 'y'
    CONFIG_LIBPOSIX_PROCESS_SIGNAL: 'y'
    CONFIG_LIBUKBINFMT: 'y'
    CONFIG_APPELFLOADER_MULTIPROCESS: 'y'
    CONFIG_APPELFLOADER_ELF_BINFMT: 'y'

    CONFIG_LIBCONTEXT: 'y'
    CONFIG_LIBCONTEXT_CLEAR_TBSS: 'y'

    # Per-process FD tables (required for multiprocess)
    CONFIG_LIBPOSIX_FDTAB_MULTITAB: 'y'

    # brk for child processes
    CONFIG_LIBPOSIX_PROCESS_BRK: 'y'

libraries:
  app-elfloader:
    source: https://github.com/unikraft/app-elfloader.git
    version: plat-hyperlight
  libelf:
    source: https://github.com/unikraft/lib-libelf.git
    version: staging

targets:
  - architecture: x86_64
    platform: hyperlight
