# hluk.toml -- the manifest for `{{name}}`. `hluk run` runs what it describes;
# see docs/manifest.md in hyperlight-unikraft for every key.
manifest_version = 1

[app]
name = "{{name}}"

[rootfs]
# The published dotnet-jit rootfs: CoreCLR plus Roslyn, so C# source goes
# in and output comes out with no host-side compile. Pinned to the hluk
# release that wrote this file.
image = "{{image}}"

[run]
script = "Program.cs"
# Guest memory in MiB. The default is the size this runtime's image is
# tested with (768 here); set it when the rootfs or the workload outgrows that.
# scratch_mb = 768
# The first `hluk run` boots and snapshots the runtime with Roslyn loaded;
# later ones restore it and only compile your file.
warm = true
# mounts = ["./data:/mnt/data:ro"]
# env = { GREETING = "hi" }
