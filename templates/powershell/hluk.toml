# hluk.toml -- the manifest for `{{name}}`. `hluk run` runs what it describes;
# see docs/manifest.md in hyperlight-unikraft for every key.
manifest_version = 1

[app]
name = "{{name}}"

[rootfs]
# The published powershell rootfs, pinned to the hluk release that wrote
# this file.
image = "{{image}}"

[run]
script = "main.ps1"
# Guest memory in MiB. The default is the size this runtime's image is
# tested with (1024 here); set it when the rootfs or the workload outgrows that.
# scratch_mb = 1024
warm = true
