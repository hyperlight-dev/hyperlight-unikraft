# hluk.toml -- the manifest for `{{name}}`. `hluk build` builds the rootfs
# and `hluk run` serves; see docs/manifest.md in hyperlight-unikraft for
# every key.
manifest_version = 1

[app]
name = "{{name}}"

[rootfs]
# A rootfs of your own: the Dockerfile starts from the published node base
# and adds the node_modules that package.json resolves. `hluk build` runs
# Docker and writes .hluk/rootfs.cpio.
dockerfile = "Dockerfile"

[run]
script = "server.js"
# Guest memory in MiB. The default is the size this runtime's image is
# tested with (512 here); set it when the rootfs or the workload outgrows that.
# scratch_mb = 512
# The first `hluk run` snapshots the booted guest with express already
# required; later ones restore it.
warm = true
warm_exec = "require('express')"

[run.net]
all = true
ports = [8080]
