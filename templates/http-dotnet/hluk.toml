# hluk.toml -- the manifest for `{{name}}`. `hluk build` builds the rootfs
# and `hluk run` serves; see docs/manifest.md in hyperlight-unikraft for
# every key.
manifest_version = 1

[app]
name = "{{name}}"

[rootfs]
# A rootfs of your own: the Dockerfile publishes the app with the .NET SDK
# and copies it onto the published dotnet-aot base at /app. `hluk build`
# runs Docker and writes .hluk/rootfs.cpio.
dockerfile = "Dockerfile"

[run]
# The published binary lives in the rootfs, so it is run by guest path.
exec = "/app/App"
# Guest memory in MiB. The default is the size this runtime's image is
# tested with (256 here); set it when the rootfs or the workload outgrows that.
# scratch_mb = 256
warm = true

[run.net]
all = true
ports = [8080]
