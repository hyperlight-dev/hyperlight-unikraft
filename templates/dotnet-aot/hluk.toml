# hluk.toml -- the manifest for `{{name}}`. `hluk build` publishes it and
# `hluk run` runs it; see docs/manifest.md in hyperlight-unikraft for every key.
manifest_version = 1

[app]
name = "{{name}}"

[rootfs]
# The published dotnet-aot rootfs: the exec driver and the musl linker an
# AOT binary needs. Your binary is mounted from the host at run time.
image = "{{image}}"

[build]
# Native AOT for Alpine (musl) on the host's CPU, built in Alpine's .NET SDK
# image so the toolchain is musl's too (a glibc toolchain links symbols the
# guest lacks).  Needs Docker: Linux on either CPU, or macOS with Docker
# Desktop; on Windows run it in WSL.
command = """docker run --rm -v "$PWD:/src" -w /src -e HOME=/tmp \
  -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
  mcr.microsoft.com/dotnet/sdk:9.0-alpine sh -c '\
    apk add --no-cache clang lld build-base zlib-dev >/dev/null && \
    dotnet publish -c Release -v q --nologo -o bin && rm -f bin/*.dbg && \
    chown -R "$HOST_UID:$HOST_GID" bin obj'"""

[run]
mounts = ["./bin:/mnt/app:ro"]
exec = "/mnt/app/App"
# Guest memory in MiB. The default is the size this runtime's image is
# tested with (256 here); set it when the rootfs or the workload outgrows that.
# scratch_mb = 256
warm = true
