# hluk.toml -- the manifest for `{{name}}`. `hluk run` runs what it describes;
# see docs/manifest.md in hyperlight-unikraft for every key.
manifest_version = 1

[app]
name = "{{name}}"

[rootfs]
# The published agent rootfs: Python plus the data-science stack an agent's
# code executor reaches for, imported once at boot so a warm snapshot has
# them loaded. Pinned to the hluk release that wrote this file.
image = "{{image}}"

[run]
script = "main.py"
# Guest memory in MiB. The default is the size this runtime's image is
# tested with (1536 here); set it when the rootfs or the workload outgrows that.
# scratch_mb = 1536
# The first `hluk run` boots and snapshots the guest with every package
# imported; each later one restores that in milliseconds.
warm = true
# Give the workload a directory to write results to, and nothing else:
# mounts = ["./out:/mnt/out"]
# [run.net]
# allow = ["pypi.org", "files.pythonhosted.org"]   # `pip install` from inside the guest
