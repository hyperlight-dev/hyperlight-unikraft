# hluk.toml -- the manifest for `{{name}}`. `hluk build` compiles it and
# `hluk run` runs it; see docs/manifest.md in hyperlight-unikraft for every key.
manifest_version = 1

[app]
name = "{{name}}"

[rootfs]
# The published go rootfs: just the exec driver and a dynamic linker. Your
# binary is not in it -- it is mounted from the host at run time.
image = "{{image}}"

[build]
# The guest's ELF loader needs a position-independent binary, hence
# -buildmode=pie; CGO_ENABLED=0 keeps it free of a host libc.
command = "CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildmode=pie -ldflags='-s -w' -o bin/app ."

[run]
# The build output, mounted read-only into the guest and run from there.
mounts = ["./bin:/mnt/app:ro"]
exec = "/mnt/app/app"
# Guest memory in MiB. The default is the size this runtime's image is
# tested with (128 here); set it when the rootfs or the workload outgrows that.
# scratch_mb = 128
warm = true
