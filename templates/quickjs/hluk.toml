# hluk.toml -- the manifest for `{{name}}`. `hluk run` runs what it describes;
# see docs/manifest.md in hyperlight-unikraft for every key.
manifest_version = 1

[app]
name = "{{name}}"

[rootfs]
# The published quickjs rootfs: QuickJS (quickjs-ng) and its qjs:std and
# qjs:os modules, pinned to the hluk release that wrote this file.
image = "{{image}}"

[run]
script = "main.js"
# Guest memory in MiB. The default is the size this runtime's image is
# tested with (64 here); set it when the workload outgrows that.
# scratch_mb = 64
# Snapshot the booted guest (engine up, driver parked) on the first
# `hluk run` and restore it on the next ones.
warm = true
# mounts = ["./data:/mnt/data:ro"]
# env = { GREETING = "hi" }
