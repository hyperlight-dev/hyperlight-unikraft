name: Fuzzing

# The host functions a guest calls, fuzzed (docs/ci.md): the fs_* and net_*
# handlers and the DNS messages the network policy reads, each target an
# hour, weekly on main, from the corpus the last run on main left.  A pull
# request that changes the fuzz targets, or the code they fuzz, runs each
# for five minutes.  `just fuzz <target>` does the same locally (justfile,
# fuzz/README.md).  This blocks nothing: a failure leaves the input that
# failed as the run's artifact.
on:
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * 0"
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fuzz.yml
      - fuzz/**
      - src/fuzzing.rs
      - src/hostfs.rs
      - src/hostnet.rs
      - src/net_policy.rs
      - src/errno.rs

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ci.yml's lint covers the root crate as hluk builds it, not the fuzz
  # crate, nor the library with the module the targets use
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "v1-rust"
          workspaces: |
            . -> target
            fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check

      # Not --locked: the fuzz crate's lock follows the root crate, a path
      # dependency, whose own changes would leave it stale
      - name: cargo clippy
        run: |
          cargo clippy --lib --features fuzzing --locked -- -D warnings
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    # An hour of fuzzing, and the build
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_hostfs, fuzz_hostnet, fuzz_dns]
    env:
      SECONDS_TO_FUZZ: ${{ github.event_name == 'pull_request' && 300 || 3600 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # Before the cache, whose key hashes the installed toolchains
      - name: Install the nightly toolchain
        run: rustup toolchain install "$(just --evaluate nightly_toolchain)" --profile minimal

      # One entry for the three: the build is the same
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "v1-rust"
          shared-key: fuzz
          workspaces: fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.target == 'fuzz_hostfs' }}

      # After the cache, which keeps the cargo-fuzz it installs
      - name: Install cargo-fuzz
        run: just ensure-cargo-fuzz

      # The corpus the last run on main left: without it each run starts
      # from nothing, and coverage-guided fuzzing never builds on itself
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # A slow input is a hang: no host call may hold the guest's vCPU
      - name: Fuzz
        run: just fuzz ${{ matrix.target }} -max_total_time="$SECONDS_TO_FUZZ" -timeout=60

      # Into the corpus, so that the next run starts with it, ci-report.yml's
      # re-run among them: finding it again could take the fuzzer hours
      - name: Keep the failing input
        if: failure()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          cp fuzz/artifacts/"$TARGET"/* "fuzz/corpus/$TARGET/" || true

      # After a failure too, so that the corpus a long run grew is kept
      - name: Save the corpus
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 28
