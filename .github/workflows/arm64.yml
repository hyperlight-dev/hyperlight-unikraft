name: arm64

# Guests on arm64: the images and test binaries built on a hosted arm64
# runner, then the integration tests on hyperlight-dev's self-hosted arm64
# runners (Linux/KVM, macOS/Hypervisor.framework and Windows/WHP), which
# hosted runners cannot stand in for.  Those runners are few and shared
# with hyperlight, so this runs on main, on demand, and on pull requests
# labelled ci/arm64 (only maintainers can label, and Dependabot labels its
# version updates, see dependabot.yml); ci-passed waits for this run on
# those already labelled when ci-passed starts.  A pull request from a
# fork runs when it is labelled, not on its later pushes: remove and re-add
# the label to test new commits.  That keeps honest runs deliberate; it is
# no security boundary, since a fork's pull request brings its own copy of
# this file.  Outside code is kept off the runners by the setting that
# requires approval before a fork's workflows run.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  rootfs-arm64:
    # On a pull request labelled ci/arm64: when that label is added, or on a
    # push to a branch of this repository (not a fork's), and not when some
    # other label is added.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci/arm64') &&
       (github.event.action == 'labeled' && github.event.label.name == 'ci/arm64' ||
        github.event.action != 'labeled' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    # Per job, not per workflow: a run whose jobs are skipped (another label
    # added) must not cancel one that is testing.
    concurrency:
      group: arm64-rootfs-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Cache key
        id: key
        # "muslaot": the .NET AOT test programs moved to a musl toolchain,
        # invalidating earlier entries.
        run: echo "key=rootfs-arm64-muslaot-${{ hashFiles('rust-toolchain.toml', 'drivers/**', 'examples/agent/custom/Dockerfile', 'examples/c/**', 'examples/rust/**', 'examples/go/**', 'examples/wasmtime/**', 'examples/dotnet-aot/**') }}" >> "$GITHUB_OUTPUT"

      - name: Cache guest images and test binaries
        id: rootfs-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-elfloader
          key: ${{ steps.key.outputs.key }}
          # Saved on Linux, restored on macOS too.
          enableCrossOsArchive: true

      - name: Install cpio
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends cpio

      - name: Install .NET SDK
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      - name: Install Go
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache: false

      - name: Build rootfs images and test binaries
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: |
          just build-all-rootfs
          just build-test-bins

      # For the test jobs: an artifact, since a macOS runner cannot restore
      # a cache entry Linux saved without zstd, which the self-hosted Macs
      # lack.
      - name: Hand the images to the test jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rootfs-arm64
          path: build-elfloader
          retention-days: 1
          if-no-files-found: error

  test-arm64:
    name: test (${{ matrix.os }}-arm64)
    needs: rootfs-arm64
    concurrency:
      group: arm64-test-${{ matrix.os }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The labels hyperlight's own arm64 jobs use (dep_build_test.yml).
          # The Linux runner is a small VM (2 CPUs, 3 GB) whose guests run
          # under nested virtualization: a large guest there takes 10-20
          # minutes per test.  It runs the suites with small guests; macOS
          # and Windows run everything, the agent, node, .NET JIT and
          # PowerShell suites included.
          - os: linux
            runner: [self-hosted, Linux, arm64, kvm]
            targets: >-
              --lib --bins --test bash --test cli --test compiled
              --test native_kernel --test networking --test project
              --test python --test python_shell --test quickjs --test resolv
              --test snapshot_mounts --test step --test wasmtime
          - os: macos
            runner: [self-hosted, macos, arm64, hvf]
            targets: --all-targets
          # A 1ES pool, which wants a JobId label unique to each job, as in
          # hyperlight's dep_build_test.yml.  As many tests at a time as
          # `just test` runs on Windows.
          - os: windows
            runner:
              - self-hosted
              - Windows
              - ARM64
              - 1ES.Pool=hl-windows-arm
              - JobId=test-arm64-windows-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}
            targets: --all-targets
            threads: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Self-hosted runners come without a Rust toolchain: install the one
      # rust-toolchain.toml pins, as hyperlight's jobs do.
      - name: Rust toolchain version
        id: rust
        shell: bash
        run: echo "toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}

      # ring compiles its C with clang, not cl.exe, on Windows arm64: use
      # Visual Studio's, as hyperlight's jobs on these runners do (they
      # find it through VSINSTALLDIR; vswhere needs no developer shell).
      - name: Put Visual Studio's clang on the PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
          if (-not $vs) { throw "no Visual Studio with its clang component" }
          $llvm = Join-Path $vs 'VC\Tools\Llvm\ARM64\bin'
          if (-not (Test-Path (Join-Path $llvm 'clang.exe'))) { throw "no clang.exe in '$llvm'" }
          $llvm >> $env:GITHUB_PATH

      - name: Fetch guest images and test binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rootfs-arm64
          path: build-elfloader

      # On macOS, cargo signs each test binary with the hypervisor
      # entitlement first and runs its tests one at a time
      # (dev/macos-sign-and-run.sh); in parallel, the Linux runner's nested
      # guests ran past the hour.  On Windows, a small pool of WHP
      # surrogate processes, spawned when needed, as `just test` sets up;
      # the other hosts ignore those variables.
      - name: cargo test
        run: cargo test --locked ${{ matrix.targets }}
        env:
          RUST_TEST_THREADS: ${{ matrix.threads || 1 }}
          HYPERLIGHT_MAX_SURROGATES: 8
          HYPERLIGHT_INITIAL_SURROGATES: 0
