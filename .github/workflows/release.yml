# Cut a release: tag the version in Cargo.toml, create a GitHub Release with
# the CHANGELOG section as notes and the `hluk` binaries, and kick off the GHCR image
# publish. Run it manually (Actions → Create release → Run workflow) after
# bumping `version` in Cargo.toml on main.
#
# crates.io publishing is intentionally NOT triggered here — see cargo-publish.yml
# and docs/RELEASE.md.
name: Create release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag + release
      actions: write # trigger publish-images.yml
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Read version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Validate version and tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$VERSION' in Cargo.toml — expected semver like 1.2.3"
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists — bump the version in Cargo.toml first"
            exit 1
          fi

      - name: Build hluk (Linux x86_64)
        run: cargo build --release --locked

      - name: Package binary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tar -C target/release -czf "hluk-v$VERSION-x86_64-unknown-linux-gnu.tar.gz" hluk

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Release notes are the matching CHANGELOG.md section (curated),
          # followed by GitHub's generated PR list.
          just changelog-notes "v$VERSION" > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::No CHANGELOG.md section for v$VERSION — add one before releasing"
            exit 1
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          # A draft until every binary and SHA256SUMS are attached (the
          # checksums job publishes it): an installer never meets a release
          # missing its platform or its checksums.
          gh release create "v$VERSION" --draft \
            --title "v$VERSION" \
            --notes-file RELEASE_NOTES.md \
            "hluk-v$VERSION-x86_64-unknown-linux-gnu.tar.gz"

      - name: Trigger GHCR image publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-images.yml --ref "v${{ steps.version.outputs.version }}"

  # Build the Windows binary on a Windows runner and attach it to the release
  # created above. Separate job so each binary is built natively (no artifact
  # hand-off needed — both upload straight to the release).
  release-windows:
    needs: release-linux
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release-linux.outputs.version }}

      - name: Build hluk (Windows x86_64)
        run: cargo build --release --locked

      - name: Package and upload binary
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ needs.release-linux.outputs.version }}"
          Compress-Archive -Path target\release\hluk.exe -DestinationPath "hluk-v$v-x86_64-pc-windows-msvc.zip"
          gh release upload "v$v" "hluk-v$v-x86_64-pc-windows-msvc.zip"

  # arm64 Linux, built natively on an arm64 runner (it embeds the arm64
  # kernel).
  release-linux-arm64:
    needs: release-linux
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release-linux.outputs.version }}

      - name: Build hluk (Linux arm64)
        run: cargo build --release --locked

      - name: Package and upload binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.release-linux.outputs.version }}"
          tar -C target/release -czf "hluk-v$VERSION-aarch64-unknown-linux-gnu.tar.gz" hluk
          gh release upload "v$VERSION" "hluk-v$VERSION-aarch64-unknown-linux-gnu.tar.gz"

  # macOS on Apple silicon.  Signed (ad hoc) with the hypervisor
  # entitlement, which Hypervisor.framework requires; install.sh signs it
  # again where it installs it.
  release-macos:
    needs: release-linux
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release-linux.outputs.version }}

      - name: Build hluk (macOS arm64)
        run: cargo build --release --locked

      - name: Sign, package and upload binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.release-linux.outputs.version }}"
          codesign -f -s - --entitlements dev/macos-entitlements.plist target/release/hluk
          tar -C target/release -czf "hluk-v$VERSION-aarch64-apple-darwin.tar.gz" hluk
          gh release upload "v$VERSION" "hluk-v$VERSION-aarch64-apple-darwin.tar.gz"

  # One checksum file over every binary, which install.sh and install.ps1
  # verify their download against; then the draft is published.
  checksums:
    needs: [release-linux, release-windows, release-linux-arm64, release-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${{ needs.release-linux.outputs.version }}"
          mkdir assets && cd assets
          gh release download "v$VERSION" --pattern 'hluk-*'
          sha256sum hluk-* > SHA256SUMS
          gh release upload "v$VERSION" SHA256SUMS --clobber
          gh release edit "v$VERSION" --draft=false
