name: arm64 host
description: >-
  Ready a self-hosted arm64 runner for arm64-jobs.yml's jobs: the pinned Rust
  toolchain, Visual Studio's clang on Windows, and the guest images and test
  binaries the rootfs-arm64 job built; and Python, when asked for.

inputs:
  python-version:
    description: A Python to put on the PATH, in a virtual environment with pip
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The self-hosted Mac and Linux hosts keep their disk between jobs:
    # show what fills it, and remove what hluk and its tests left there.
    - name: Disk usage and cleanup
      if: runner.os != 'Windows'
      shell: bash
      run: bash dev/ci-disk.sh

    # hluk's cache (pulled images, warm snapshots) in the job's temp
    # directory, which the runner empties when the job ends, cancelled or
    # not: a job leaves none of it behind.
    - name: A job-scoped hluk cache
      if: runner.os != 'Windows'
      shell: bash
      run: echo "HLUK_CACHE_DIR=$RUNNER_TEMP/hluk-cache" >> "$GITHUB_ENV"

    # Self-hosted runners come without a Rust toolchain: install the one
    # rust-toolchain.toml pins, as hyperlight's jobs do.
    - name: Rust toolchain version
      id: rust
      shell: bash
      run: echo "toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: ${{ steps.rust.outputs.toolchain }}

    # ring compiles its C with clang, not cl.exe, on Windows arm64: use
    # Visual Studio's, as hyperlight's jobs on these runners do (they find
    # it through VSINSTALLDIR; vswhere needs no developer shell).  The
    # pool's newer image has Build Tools without that component and a
    # standalone LLVM instead.
    - name: Put clang on the PATH
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
        $llvm = if ($vs) { Join-Path $vs 'VC\Tools\Llvm\ARM64\bin' } else { Join-Path $env:ProgramFiles 'LLVM\bin' }
        if (-not (Test-Path (Join-Path $llvm 'clang.exe'))) { throw "no clang.exe in '$llvm'" }
        $llvm >> $env:GITHUB_PATH

    - name: Fetch guest images and test binaries
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: rootfs-arm64
        path: build-elfloader

    # An artifact keeps no file modes, and a mount gives the guest the
    # host's: the test binaries must be executable again to run
    - name: Make the test binaries executable
      if: runner.os != 'Windows'
      shell: bash
      run: chmod -R a+x build-elfloader/bins

    # Not setup-python, which installs Python with sudo on macOS, which the
    # self-hosted Mac does not allow.
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      if: inputs.python-version != ''

    - name: Python ${{ inputs.python-version }}
      if: inputs.python-version != ''
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        uv venv --seed --python "$PYTHON_VERSION" "$RUNNER_TEMP/venv"
        if [ "$RUNNER_OS" = Windows ]; then
          echo "$RUNNER_TEMP/venv/Scripts" >> "$GITHUB_PATH"
        else
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        fi
