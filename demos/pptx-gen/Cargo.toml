[package]
name = "hyperlight-pptx-gen"
version = "0.1.0"
edition = "2021"
description = "PowerPoint generator using hluk sandboxed Python execution"

[dependencies]
# The hluk library crate at the repo root.
hyperlight-unikraft = { path = "../.." }

async-openai = "0.25"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# hyperlight main, for scratch resize (#1947) and scratch_allocated_bytes
# (#2019). crates.io takes no git dependency, so hyperlight-unikraft is not
# published until a hyperlight release replaces this.
[patch.crates-io]
hyperlight-host = { git = "https://github.com/hyperlight-dev/hyperlight", rev = "6c17f7cd4e78b03d77fadf4cfe749d7ede96b7ab" }
hyperlight-common = { git = "https://github.com/hyperlight-dev/hyperlight", rev = "6c17f7cd4e78b03d77fadf4cfe749d7ede96b7ab" }
