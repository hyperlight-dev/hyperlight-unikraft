[package]
name = "hyperlight-pptx-gen"
version = "0.1.0"
edition = "2021"
description = "PowerPoint generator using hluk sandboxed Python execution"

[dependencies]
# The hluk library crate at the repo root.
hyperlight-unikraft = { path = "../.." }

async-openai = "0.25"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
